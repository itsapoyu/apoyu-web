<!--
  🔴 THE FIRST PAINT IS THE HERO, NOT A SPINNER.

  The exact card runtime is about 4.4 MB gzipped before it can draw a pixel. A visitor on a
  mediocre connection must not meet a dark rectangle while that streams in, so everything below is
  real, final hero content in plain HTML and CSS: the mark, the headline, the supporting line, the
  card's canonical poster in a card-shaped stage, the call to action and the fine print. It is
  understandable before a single byte of JavaScript executes, and React replaces it with the same
  composition — running the app's real renderer — once the stack is ready.

  🔴 IT STAYS AS A VEIL UNTIL THE EXACT CARD HAS ITS POSTER (W3.3F). React committing is the
  application's readiness, not the hero object's: the canonical card fetches its poster AFTER it
  mounts, and on a slow connection that left a black art window where this poster had just been.
  So on `/`, `index.js` turns this block into a pointer-transparent overlay at commit and fades it
  out only on `apoyu:hero-ready`. Both compositions share every class below, so they are the same
  size and the crossfade is poster → card and nothing else.

  🔴 EVERY STRING HERE IS GENERATED. The double-brace placeholders below are filled by
  `scripts/finish-export.mjs` from `content/landing-copy.json`, the same file React reads, and an
  unresolved one fails the build. Do not type copy into this document: a landing page whose pre-JS
  text and post-JS text can disagree WILL eventually disagree. The poster `src` is rewritten by the
  same script to the hashed asset the exact card will request, so the second fetch is a cache hit.
-->
<style>
  :root {
    --ink: #F4EFE6;
    --ink-dim: #A99E90;
    --ember: #FFB25C;
    --ember-deep: #E0742C;
    --night: 0;
    /* The second leg (W3.4): 0 at midnight → 1 in the deep of the night, where Scenario lives. */
    --deep: 0;
    /* The third leg (W3.6 W3A): 0 through the Daily Loop → 1 as the Collection takes the screen.
       Blue hour, not sunrise: the plum leaves, the fire goes out, a cold seam appears low down. */
    --dawn: 0;
    /* The fourth and fifth legs (W3.7): 0 through the Collection → 1 as Trust takes the screen,
       then 0 → 1 as the closing CTA does. First light, then sunrise. Both are IDENTITY at 0, so
       every term below them is pixel-unchanged anywhere above Trust. */
    --light: 0;
    --sun: 0;
    /* 🔴 MIRRORS `src/landing/card-scale.ts`. Change both or neither. */
    --card-w: min(82vw, 360px);
    --pull-w: min(76vw, 320px);
  }
  @media (min-width: 600px) {
    :root { --card-w: min(430px, 70vw, calc(58svh / 1.49)); --pull-w: min(380px, 60vw, calc(52svh / 1.49)); }
  }
  @media (min-width: 900px) {
    :root { --card-w: min(480px, calc(72svh / 1.49), 34vw); --pull-w: min(420px, calc(62svh / 1.49), 30vw); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #150C20; color: var(--ink);
    font-family: ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  body { position: relative; }
  /* Display strings in the app's own face; everything else stays in the system's. */
  .apoyu-mark, .apoyu-headline, .apoyu-eyebrow, .apoyu-subhead, .apoyu-back__mark,
  .apoyu-trust__claim, .apoyu-acc__button {
    font-family: 'Fredoka-SemiBold', ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif;
    font-weight: 600; }

  /* ── THE CONTINUOUS ENVIRONMENT ─────────────────────────────────────────────
     One fixed backdrop for the whole document. Sections never paint their own
     background; they sit in this room. `--night` is driven by scroll, so the
     light travels dusk → midnight without a single horizontal divider.
     Dusk: warm plum with the fire still high. Midnight: indigo-black, the fire
     banked to a glow, cool light arriving from above. */
  .apoyu-env { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .apoyu-env__ground {
    position: absolute; inset: 0;
    /* Dusk → midnight on `--night`; midnight → the deep of the night on `--deep`, where the last
       plum leaves the top of the room and the ground goes cool. */
    /* And the last plum leaves on `--dawn`: the ground cools to indigo and deep blue, with the
       floor lightening just enough that the room has a far wall. */
    /* Then `--light` warms the floor and the 78 % stop from deep blue toward a slate-mauve while
       the top stop stays indigo — Trust is FIRST light, never daylight — and `--sun` finishes the
       journey: a dawn violet-blue overhead, mauve through the middle, a warm rose-umber on the lit
       floor the closing ask stands on. FIVE legs, one gradient, one rAF-coalesced apply — never a
       second scroll listener and never a section background. Each leg MULTIPLIES the one inside
       it and is identity at 0, so nothing above the Collection moves by a single channel. */
    background:
      linear-gradient(180deg,
        color-mix(in oklab, color-mix(in oklab, color-mix(in oklab, color-mix(in oklab, color-mix(in oklab, #301636 calc((1 - var(--night)) * 100%), #0D0A1F) calc((1 - var(--deep)) * 100%), #080A1C) calc((1 - var(--dawn)) * 100%), #101A3D) calc((1 - var(--light)) * 100%), #141C3E) calc((1 - var(--sun)) * 100%), #2A3060) 0%,
        color-mix(in oklab, color-mix(in oklab, color-mix(in oklab, color-mix(in oklab, color-mix(in oklab, #1B1029 calc((1 - var(--night)) * 100%), #0F0B1D) calc((1 - var(--deep)) * 100%), #0A0B19) calc((1 - var(--dawn)) * 100%), #0D1531) calc((1 - var(--light)) * 100%), #1C2140) calc((1 - var(--sun)) * 100%), #4A3A5E) 44%,
        color-mix(in oklab, color-mix(in oklab, color-mix(in oklab, color-mix(in oklab, color-mix(in oklab, #15091F calc((1 - var(--night)) * 100%), #0B0916) calc((1 - var(--deep)) * 100%), #080814) calc((1 - var(--dawn)) * 100%), #0B1230) calc((1 - var(--light)) * 100%), #2A2438) calc((1 - var(--sun)) * 100%), #6A4650) 78%,
        color-mix(in oklab, color-mix(in oklab, color-mix(in oklab, color-mix(in oklab, #0E0816 calc((1 - var(--deep)) * 100%), #070710) calc((1 - var(--dawn)) * 100%), #0A1029) calc((1 - var(--light)) * 100%), #3A2B36) calc((1 - var(--sun)) * 100%), #7A4E42) 100%);
  }
  /* The fire, always below the horizon: one source, so every warm highlight is motivated. */
  .apoyu-env__ember {
    position: absolute; left: 50%; bottom: -30vh; width: 160vw; height: 86vh;
    transform: translateX(-50%);
    /* Banks fast as the visitor descends: at half a viewport the fire has already receded to a
       third, so the mid-scroll reads as the room darkening rather than the same wash twice. */
    /* And banks to an ember by the deep of the night: the Scenario's stage carries its own fire
       under the card, so the room's may recede almost entirely. */
    /* And by blue hour the fire is OUT. The warm light left in the room by then belongs to the
       cards themselves, which is the whole point of warm embers against a cold ground. */
    background: radial-gradient(closest-side,
      rgba(255, 150, 62, calc((0.34 - var(--night) * 0.28 - var(--deep) * 0.04) * (1 - var(--dawn)))) 0%,
      rgba(214, 96, 40, calc((0.17 - var(--night) * 0.14 - var(--deep) * 0.02) * (1 - var(--dawn)))) 46%,
      rgba(120, 44, 26, 0) 78%);
    filter: blur(8px);
  }
  /* On desktop the fire sits toward the card's side of the room, so the object is the lit thing
     and the copy column stays in shadow; a fire centred under the text was the one asymmetry the
     composition had backwards. */
  @media (min-width: 900px) { .apoyu-env__ember { left: 60%; } }
  /* Cool night light arriving from above as the visitor descends toward Today's Pull. */
  .apoyu-env__moon {
    position: absolute; right: -14vw; top: -34vh; width: 118vw; height: 104vh;
    /* Cooler and a little stronger in the deep of the night. */
    /* The moon SETS as the light arrives from the horizon instead. Two sources overhead and below
       at once would be the sourceless-light tell the Banked Hearth law exists to prevent. */
    background: radial-gradient(closest-side,
      rgba(146, 172, 255, calc((var(--night) * 0.22 + var(--deep) * 0.04) * (1 - var(--dawn)))) 0%,
      rgba(96, 118, 208, calc((var(--night) * 0.09 + var(--deep) * 0.015) * (1 - var(--dawn)))) 50%,
      rgba(60, 70, 140, 0) 76%);
    filter: blur(12px);
  }
  /* BLUE HOUR. The first horizon separation: a thin cold seam low on the wall with the faintest
     wash under it. Deliberately NOT a sky and NOT a sunrise glow — it is the moment shapes become
     visible, and it arrives only with `--dawn`, so it does not exist anywhere above the Collection. */
  .apoyu-env__horizon {
    position: absolute; left: -10vw; right: -10vw; top: 58vh; height: 30vh;
    pointer-events: none; filter: blur(10px);
    /* And the cold seam LEAVES as the warm one arrives. Two horizons at once — one blue, one
       peach, at the same height — would read as a colour bug rather than as time passing. */
    opacity: calc(var(--dawn) * (1 - var(--light)));
    background: linear-gradient(180deg,
      rgba(120, 160, 220, 0) 0%,
      rgba(120, 160, 220, .10) 44%,
      rgba(140, 200, 235, .16) 62%,
      rgba(120, 160, 220, .05) 74%,
      rgba(120, 160, 220, 0) 100%);
  }
  /* FIRST LIGHT (W3.7). The same band as the seam, two viewport-percent lower and wider, in
     peach-gold at a peak of .14: warm, and deliberately NOT bright — the room above it is still
     dark, and Trust is the moment before the sun rather than the sun. It dims as the sun arrives
     behind it, because a band of haze in front of a risen sun is the one thing a real dawn never
     does. */
  .apoyu-env__firstlight {
    position: absolute; left: -10vw; right: -10vw; top: 56vh; height: 34vh;
    pointer-events: none; filter: blur(14px);
    background: linear-gradient(180deg,
      rgba(255, 196, 140, 0) 0%,
      rgba(255, 196, 140, .09) 40%,
      rgba(255, 210, 160, .14) 60%,
      rgba(255, 196, 140, .04) 76%,
      rgba(255, 196, 140, 0) 100%);
    opacity: calc(var(--light) * (1 - var(--sun) * 0.6));
  }
  /* SUNRISE (W3.7). The ember's warmth returned as natural light: the same family of hue the fire
     spent the whole night in, now a wider and cleaner source rising from below the bottom edge,
     with a faint peach wash over the lower half behind it. No sparks — those belonged to the fire,
     and the fire went out at blue hour. This is the only warm ground the page has had since dusk,
     and it arrives exactly where the ask is. */
  .apoyu-env__sun {
    position: absolute; left: 50%; bottom: -34vh; width: 170vw; height: 96vh;
    transform: translateX(-50%); pointer-events: none; filter: blur(10px);
    background:
      radial-gradient(closest-side,
        rgba(255, 214, 150, .42) 0%,
        rgba(255, 160, 90, .24) 34%,
        rgba(230, 110, 60, .08) 62%,
        rgba(180, 80, 50, 0) 78%),
      linear-gradient(180deg, rgba(255, 190, 140, 0) 0%, rgba(255, 190, 140, .06) 100%);
    opacity: var(--sun);
  }
  /* Film grain. Kills the flat digital-fill read of a large dark area. */
  .apoyu-env__grain {
    position: absolute; inset: -50%; opacity: 0.03; mix-blend-mode: overlay;
    background-image: repeating-conic-gradient(#fff 0% 25%, #000 0% 50%);
    background-size: 3px 3px;
  }
  .apoyu-env__sparks {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(1.6px 1.6px at 18% 78%, rgba(255,196,128,.55), transparent 60%),
      radial-gradient(1.3px 1.3px at 72% 86%, rgba(255,178,92,.45), transparent 60%),
      radial-gradient(1.1px 1.1px at 44% 92%, rgba(255,208,150,.40), transparent 60%),
      radial-gradient(1.4px 1.4px at 88% 68%, rgba(255,170,96,.35), transparent 60%);
