<style>
  :root {
    --ink: #F4EFE6;
    --ink-dim: #A79C8E;
    --ember: #FFB25C;
    --ember-deep: #E0742C;
    --night: 0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #150C20; color: var(--ink);

    -webkit-font-smoothing: antialiased; overflow-x: hidden; }

  /* ── THE CONTINUOUS ENVIRONMENT ─────────────────────────────────────────────

  .apoyu-env { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .apoyu-env__ground {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg,
        color-mix(in oklab, #2A1330 calc((1 - var(--night)) * 100%), #140B22) 0%,
        #170E24 42%,
        #12091C 78%,
        #100816 100%);
  }
  /* The fire, always below the horizon: one source, so every warm highlight is motivated. */
  .apoyu-env__ember {
    position: absolute; left: 50%; bottom: -34vh; width: 150vw; height: 82vh;
    transform: translateX(-50%);
    background: radial-gradient(closest-side,
      rgba(255, 150, 62, calc(0.30 - var(--night) * 0.12)) 0%,
      rgba(214, 96, 40, calc(0.15 - var(--night) * 0.06)) 45%,
      rgba(120, 44, 26, 0) 78%);
    filter: blur(6px);
  }
  /* Cool night light arriving from above as the visitor descends toward Today's Pull. */
  .apoyu-env__moon {
    position: absolute; right: -18vw; top: -22vh; width: 92vw; height: 92vh;
    background: radial-gradient(closest-side,
      rgba(150, 176, 255, calc(var(--night) * 0.13)) 0%,
      rgba(96, 118, 208, calc(var(--night) * 0.06)) 52%,
      rgba(60, 70, 140, 0) 76%);
    filter: blur(10px);
  }
  /* Film grain. Kills the flat digital-fill read of a large dark area. */
  .apoyu-env__grain {
    position: absolute; inset: -50%; opacity: 0.028; mix-blend-mode: overlay;
    background-image: repeating-conic-gradient(#fff 0% 25%, #000 0% 50%);
    background-size: 3px 3px;
  }
  .apoyu-env__sparks {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(1.6px 1.6px at 18% 78%, rgba(255,196,128,.55), transparent 60%),
      radial-gradient(1.3px 1.3px at 72% 86%, rgba(255,178,92,.45), transparent 60%),
      radial-gradient(1.1px 1.1px at 44% 92%, rgba(255,208,150,.40), transparent 60%),
      radial-gradient(1.4px 1.4px at 88% 68%, rgba(255,170,96,.35), transparent 60%);
    animation: apoyu-rise 26s linear infinite;
    opacity: calc(0.85 - var(--night) * 0.35);
  }
  @keyframes apoyu-rise { from { transform: translateY(0); } to { transform: translateY(-22vh); } }
  .apoyu-env--still .apoyu-env__sparks { animation: none; }
  @media (prefers-reduced-motion: reduce) { .apoyu-env__sparks { animation: none; } }

  /* ── LANDING LAYOUT ─────────────────────────────────────────────────────── */
  .apoyu-stage { position: relative; z-index: 1; }
  .apoyu-beat { position: relative; margin: 0 auto; padding: 0 24px; max-width: 1180px;

  .apoyu-mark { font-size: 15px; letter-spacing: .16em; color: var(--ember); margin: 0;

  .apoyu-pullcard.is-revealed .apoyu-flip { transform: rotateY(180deg); }
  .apoyu-flip--instant { transition: none; }
  .apoyu-flip__back, .apoyu-flip__front { position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: grid; place-items: center; }
  .apoyu-flip__front { transform: rotateY(180deg); }
  /* THE BACK: manufactured card stock, not an empty rectangle. A milled edge, an inset frame
     line, a warm centre where the fire reaches it, and one ember seal. Deliberately NOT an egg —
     Birth is the app's surprise and the website must not spend it. */
  .apoyu-flip__back { border-radius: 5.6%; overflow: hidden;
    background:
      radial-gradient(58% 42% at 50% 50%, rgba(255,150,60,.10) 0%, rgba(255,150,60,0) 70%),
      radial-gradient(120% 80% at 50% 118%, rgba(255,140,55,.20) 0%, rgba(255,140,55,0) 60%),
      repeating-linear-gradient(122deg, rgba(255,225,190,.022) 0 2px, rgba(0,0,0,0) 2px 7px),
      linear-gradient(158deg, #2A1A3C 0%, #1D1229 44%, #150C1E 100%);
    box-shadow:
      0 40px 90px -30px rgba(0,0,0,.86),
      0 0 0 1px rgba(255,220,180,.10) inset,
      0 0 90px -30px rgba(255,150,60,.35) inset; }
  /* The inset frame line: what makes it read as a printed back rather than a dark div. */
  .apoyu-flip__back::before { content: ''; position: absolute; inset: 5.5%;
    border-radius: 4%; border: 1px solid rgba(255,222,186,.09);
    box-shadow: 0 0 0 1px rgba(0,0,0,.28) inset; }
  .apoyu-seal { position: relative; width: 58px; height: 58px; border-radius: 50%;

    box-shadow:
      0 0 34px -4px rgba(255,150,60,.62),
      0 0 0 1px rgba(255,214,170,.34),
      0 0 0 9px rgba(255,150,60,.05),
      0 0 0 10px rgba(255,150,60,.05); }
  /* A quiet ring around the seal, like an embossed collar. */
  .apoyu-seal::after { content: ''; position: absolute; inset: -20px; border-radius: 50%;
    border: 1px solid rgba(255,196,140,.13); }
  @media (prefers-reduced-motion: reduce) { .apoyu-flip { transition: none; } }

  @media (min-width: 900px) {
    .apoyu-pull { grid-template-columns: minmax(0,.9fr) minmax(0,1fr); align-items: center;

  }
  @media (max-width: 899px) {

  /* ── PREVIEW SHEET ──────────────────────────────────────────────────────── */
