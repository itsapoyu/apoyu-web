    /* Sparks are the fire's; when the fire is out they are gone with it. */
    opacity: calc((0.85 - var(--night) * 0.5) * (1 - var(--dawn)));
  }
  @keyframes apoyu-rise { from { transform: translateY(0); } to { transform: translateY(-22vh); } }
  .apoyu-env--still .apoyu-env__sparks { animation: none; }
  @media (prefers-reduced-motion: reduce) { .apoyu-env__sparks { animation: none; } }

  /* ── LANDING LAYOUT ─────────────────────────────────────────────────────── */
  .apoyu-stage { position: relative; z-index: 1; }
  .apoyu-beat { position: relative; margin: 0 auto; padding: 0 24px; max-width: 1240px;
    width: 100%; }

  /* THE HERO. One grid, two compositions. Phone: the copy, then the object, then the ask —
     tell me, show me, ask me — centred on one axis so it never reads as a stacked desktop
     layout. Desktop: copy and ask in the left column, vertically centred on the card. */
  .apoyu-hero { min-height: 100svh; display: grid; align-content: center;
    grid-template-areas: "copy" "card" "act"; justify-items: center; text-align: center;
    row-gap: 22px; padding-top: 28px; padding-bottom: 44px; }
  .apoyu-hero__copy { grid-area: copy; display: grid; gap: 14px; justify-items: center; }
  .apoyu-cardstage { grid-area: card; }
  .apoyu-act { grid-area: act; display: grid; gap: 12px; justify-items: center; }
  /* The BRAND, not an eyebrow (W3.3F.1, founder). 14 px at .18em read as a second label next to
     TODAY'S PULL; 20 px at .06em is a mark: bigger than the eyebrow, well under the headline,
     same place, same ember, same face. Identical in the pre-JS hero, so nothing jumps on commit. */
  .apoyu-mark { font-size: 20px; letter-spacing: .06em; color: var(--ember); margin: 0;
    font-weight: 600; line-height: 1; }
  /* 20ch, not 15: "Meet your recovery." must sit on one line in Fredoka, whose glyphs run wider
     than the system face the 15ch was measured against — at 15ch it broke as "recovery. It". */
  .apoyu-headline { margin: 0; line-height: 1.04; letter-spacing: .004em;
    font-size: clamp(30px, 7.6vw, 60px); max-width: 20ch; text-wrap: balance; }
  .apoyu-support { margin: 0; color: var(--ink-dim); font-size: clamp(16px, 1.1vw + 10px, 19px);
    line-height: 1.45; max-width: 42ch; text-wrap: balance; }
  .apoyu-support em { font-style: normal; color: var(--ink); }
  .apoyu-cta { appearance: none; border: 0; cursor: pointer; display: inline-flex;
    align-items: center; justify-content: center; padding: 15px 28px; border-radius: 999px;
    font: inherit; font-size: 16px; font-weight: 600; letter-spacing: .005em; color: #21120A;
    background: linear-gradient(180deg, #FFC178 0%, var(--ember) 46%, var(--ember-deep) 100%);
    box-shadow: 0 14px 34px -14px rgba(255, 140, 50, .55), 0 1px 0 rgba(255,255,255,.32) inset;
    transition: transform 140ms ease, box-shadow 140ms ease, opacity 320ms ease; }
  .apoyu-cta:hover { transform: translateY(-1px);
    box-shadow: 0 18px 40px -14px rgba(255,140,50,.68), 0 1px 0 rgba(255,255,255,.4) inset; }
  .apoyu-cta:active { transform: translateY(0); }
  .apoyu-cta:focus-visible { outline: 2px solid #FFD9A8; outline-offset: 3px; }
  /* The pre-runtime CTA is HONESTLY dormant. Until React owns it nothing happens on press, and
     a control that looks live but is dead is worse than one that visibly has not woken yet. It
     brightens through the veil crossfade the moment the real one is underneath. */
  .apoyu-cta[disabled] { opacity: .58; cursor: progress; box-shadow: none; }
  .apoyu-fine { margin: 0; color: var(--ink-dim); font-size: 13px; }

  /* THE STAGE: the object placed in the room, not in a grid cell. The fire below the horizon
     reaches the card's underside (light), the card has weight (shadow), and both are outer
     presentation — nothing here redraws frame, orb, gem, glass or plaque. */
  /* 900 px perspective, not 1100: at 7–8° the closer eye makes the turn legible on a phone. */
  .apoyu-cardstage { position: relative; display: grid; place-items: center; perspective: 900px;
    width: var(--card-w); }
  #root .apoyu-cardstage { width: auto; }
  .apoyu-cardstage__light { position: absolute; left: -22%; right: -22%; bottom: -14%; height: 62%;
    pointer-events: none; z-index: 0; filter: blur(22px);
    background: radial-gradient(ellipse at 50% 96%,
      rgba(255, 146, 58, .30) 0%, rgba(230, 110, 44, .14) 38%, rgba(160, 60, 30, 0) 72%); }
  .apoyu-cardstage__shadow { position: absolute; left: 8%; right: 8%; bottom: -6%; height: 22%;
    pointer-events: none; z-index: 0; filter: blur(18px); border-radius: 50%;
    background: radial-gradient(ellipse at 50% 50%, rgba(6, 2, 10, .78) 0%, rgba(6, 2, 10, .38) 50%,
      rgba(6, 2, 10, 0) 100%); }
  .apoyu-cardstage img { display: block; width: 100%; height: auto; border-radius: 5.6%;
    position: relative; z-index: 1;
    box-shadow: 0 34px 70px -28px rgba(0,0,0,.9), 0 0 0 1px rgba(255,220,180,.06); }

  @media (min-width: 900px) {
    .apoyu-beat { padding: 0 48px; }
    .apoyu-hero { grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas: "copy card" "act card"; align-items: center; text-align: left;
      justify-items: start; column-gap: clamp(48px, 6vw, 104px); row-gap: 30px;
      padding-top: 40px; padding-bottom: 40px; }
    .apoyu-hero__copy { align-self: end; justify-items: start; gap: 22px; }
    .apoyu-act { align-self: start; justify-items: start; }
    .apoyu-cardstage { justify-self: end; align-self: center; }
    /* Sized so "Meet your recovery." holds one line in the copy column at 1024×768 (~470 px). */
    .apoyu-headline { font-size: clamp(40px, 3.6vw + 8px, 66px); }
    .apoyu-mark { font-size: 22px; }
  }

  /* ── TILT + GLARE (browser-only presentation, never card geometry) ─────── */
  .apoyu-tiltable { position: relative; z-index: 1; transform-style: preserve-3d;
    will-change: transform; touch-action: pan-y; }
  .apoyu-glare { position: absolute; inset: 0; border-radius: 5.6%; pointer-events: none;
    mix-blend-mode: screen; opacity: 0; will-change: opacity, background; }
  /* A bare stage (W3.3F.2): the same coordinate space, shadow, tilt and glare on a surface that
     does not light the room — the Scenario diagnostic's card today. */
  .apoyu-cardstage--bare { width: auto; }
  /* 🔴 THE BARE STAGE IS EXACT AT REST (W3.4.1, WEB-96). Three compositor effects were filtering a
     card nobody had touched, each measured against a direct canonical mount at 390x844 under
     software GL, each invisible on its own and none of them acceptable in a collectible:
       preserve-3d   a 3D rendering context, so the card is composited through a projective
                     transform: 35,520 of 673,350 pixels, max 4/255, at rest.
       screen        the always-mounted glare's blend forces this subtree to be rendered as a blend
                     group even at opacity 0: another 2,378 pixels, all at 1/255.
       will-change   the promotion itself, once the other two are gone, is the last 64 pixels: a
                     promoted layer is composited from its own texture and a directly painted one
                     is not.
     A TILTING card needs all three, and it gets all three, unchanged -- a held pose is the same
     drawing W3.3F.2 froze, down to the rasterisation path (`transform-style: flat` renders a
     rotated card through texture mapping instead: not softer, measured at -0.03 % edge energy, but
     119,316 pixels away from the pose the founder approved, and the tilt is not what W3.4.1 was
     asked to change). What the card does NOT need is any of them while it is standing still.
     So they come back in TWO steps, because together they cost far more than apart (the layer alone
     64 px, the blend alone 2,378, all three at once 35,519, and all of it compositing rounding
     rather than blur: 0.15 % of the card's edge energy at the very worst, mean |delta| 0.055/255):
       data-tilt="armed"    the LAYER, the moment a finger lands and before it has moved, so the
                            gesture never waits on a promotion. 64 pixels, on a still card.
       data-tilt="active"   the 3D context and the blend, on the first written frame -- the frame
                            the glare appears in and the card starts to lean, so the larger change
                            happens under motion and new light rather than on a still card.
     Both are held for the whole 420 ms release; no attribute means rest, so the exact state is also
     the default state. The Hero keeps its own stage untouched: every rule here is scoped to
     `--bare`. */
  .apoyu-cardstage--bare .apoyu-tiltable { transform-style: flat; will-change: auto; }
  .apoyu-cardstage--bare .apoyu-glare { mix-blend-mode: normal; }
  .apoyu-cardstage--bare[data-tilt] .apoyu-tiltable { will-change: transform; }
  .apoyu-cardstage--bare[data-tilt="active"] .apoyu-tiltable { transform-style: preserve-3d; }
  .apoyu-cardstage--bare[data-tilt="active"] .apoyu-glare { mix-blend-mode: screen; }
  /* Probe-only (`/?scenarioControl=1`): the canonical card's stacking in the production stage, and
     nothing else — the same `position: relative; z-index: 1` the tiltable carries so the card sits
     above the contact shadow, with none of the compositing under test. */
  .apoyu-scn__control { position: relative; z-index: 1; }

  /* ── TODAY'S PULL (midnight) ────────────────────────────────────────────── */
  /* No min-height of its own: the beat is as tall as its content plus air, so the scroll from
     the Hero reads as one room getting darker rather than two screens with a void between. On
     desktop the card takes the LEFT, so the eye travels from the hero card (right) diagonally
     down to the pull card — a path through the room, not a repeated template row. */
  .apoyu-pull { display: grid; grid-template-areas: "copy" "card"; justify-items: center;
    text-align: center; row-gap: 30px;
    padding-top: clamp(56px, 12vh, 140px); padding-bottom: clamp(80px, 16vh, 180px); }
  .apoyu-pull__copy { grid-area: copy; display: grid; gap: 12px; justify-items: center; }
  .apoyu-pull__stage { grid-area: card; position: relative; display: grid; place-items: center;
    perspective: 1400px; }
  .apoyu-eyebrow { margin: 0; font-size: 12px; letter-spacing: .2em; color: var(--ember);
    font-weight: 600; }
  .apoyu-subhead { margin: 0; line-height: 1.08; letter-spacing: .004em;
    font-size: clamp(28px, 5.4vw, 44px); max-width: 18ch; text-wrap: balance; }
  .apoyu-pull__hint { color: var(--ink-dim); }
  /* Midnight on the stage: cool light from above right, the last of the fire from below. */
  .apoyu-pull__light { position: absolute; inset: -18% -26% -16% -26%; pointer-events: none;
    z-index: 0; filter: blur(26px);
    background:
      radial-gradient(ellipse at 72% 4%, rgba(150, 176, 255, .10) 0%, rgba(120, 140, 230, .04) 42%, rgba(80, 90, 180, 0) 70%),
      radial-gradient(ellipse at 50% 100%, rgba(255, 140, 60, .12) 0%, rgba(200, 90, 40, .04) 40%, rgba(120, 44, 26, 0) 68%); }
  /* The pull card has weight too: the same contact shadow the hero card stands on. */
  .apoyu-pull__shadow { position: absolute; left: 10%; right: 10%; bottom: -5%; height: 20%;
    pointer-events: none; z-index: 0; filter: blur(18px); border-radius: 50%;
    background: radial-gradient(ellipse at 50% 50%, rgba(4, 2, 10, .7) 0%, rgba(4, 2, 10, .3) 50%,
      rgba(4, 2, 10, 0) 100%); }
  .apoyu-pullcard { appearance: none; border: 0; background: none; padding: 0; cursor: pointer;
    display: block; position: relative; z-index: 1; }
  .apoyu-pullcard.is-revealed { cursor: default; }
  .apoyu-pullcard:focus-visible { outline: 2px solid #FFD9A8; outline-offset: 8px;
    border-radius: 18px; }
  .apoyu-flip { position: absolute; inset: 0; transform-style: preserve-3d;
    transition: transform 720ms cubic-bezier(.2,.7,.2,1); }
  .apoyu-pullcard.is-revealed .apoyu-flip { transform: rotateY(180deg); }
  .apoyu-flip--instant { transition: none; }
  .apoyu-flip__back, .apoyu-flip__front { position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: grid; place-items: center; }
  .apoyu-flip__front { transform: rotateY(180deg); }
  /* THE BACK (W3.3F.1): manufactured collectible card stock. Deep plum stock with a pressed-fibre
     microtexture (the app's own hearth-noise, `--stock-noise`), a whisper of satin across it, one
     debossed perimeter line, and ONE blind-embossed Apoyü mascot — the Today-tab IconProfile
     artboard exported as a still — catching the midnight light from above and the fire from below.
     No stripes, no circles, no wordmark, nothing that glows by itself, nothing egg-shaped. */
  .apoyu-flip__back { border-radius: 5.6%; overflow: hidden; isolation: isolate;
    background:
      radial-gradient(90% 60% at 70% -6%, rgba(150,176,255,.11) 0%, rgba(150,176,255,0) 62%),
      radial-gradient(110% 70% at 50% 112%, rgba(255,140,55,.16) 0%, rgba(255,140,55,0) 60%),
      linear-gradient(118deg, rgba(255,236,214,0) 34%, rgba(255,236,214,.035) 50%, rgba(255,236,214,0) 66%),
      linear-gradient(160deg, #2B1A3F 0%, #1D1329 52%, #140D1F 100%);
    box-shadow:
      0 36px 80px -30px rgba(0,0,0,.9),
      0 0 0 1px rgba(255,220,180,.13) inset,
      0 -1px 0 rgba(0,0,0,.4) inset; }
  /* Pressed fibre: the app's own noise, twice at fine scale, so the tile never reads as a tile. */
  .apoyu-flip__back::before { content: ''; position: absolute; inset: 0; pointer-events: none;
    background-image: var(--stock-noise), var(--stock-noise);
    background-size: 96px 96px, 150px 150px; background-position: 0 0, 41px 23px;
    mix-blend-mode: soft-light; opacity: .42; }
  /* One debossed perimeter line: a dark cut with a hair of light below it. */
  .apoyu-flip__back::after { content: ''; position: absolute; inset: 6%; pointer-events: none;
    border-radius: 4%; border: 1px solid rgba(0,0,0,.42);
    box-shadow: 0 1px 0 rgba(255,226,196,.10), 0 -1px 0 rgba(0,0,0,.25) inset; }
  /* THE DEBOSS (W3.3F.2, founder: "does not yet feel like part of the card"). W3.3F.1 stacked three
     full copies of the mark — a dark face, a light copy up-left, a dark copy down-right — which is
     the anatomy of a sticker with a drop shadow, however it is described. A pressed mark has no
     copies: it has EDGES. So every layer below is the mark's luminance as a mask, and a rim is the
     mark MINUS itself shifted by a hair (mask-composite: subtract), so light lives only on the
     edge and hugs the form. Read from the room's light above: the top wall of the recess is in
     shadow, the far lip catches the light, the stock lifts a hair around the rim, and the floor is
     the SAME stock a shade darker under its wall — the fibre continues through it — with a whisper
     of the back's own satin diagonal, because pressed fibre is a hair glossier. Three candidates
     were captured before choosing (docs/design-proposals/2026-09-07-web-w33f2-premium-interaction). */
  .apoyu-back__mark { position: relative; z-index: 0; width: 40%; aspect-ratio: 1; pointer-events: none;
    --dx: .6px; --dy: 1.7px; }
  .apoyu-back__mark i { position: absolute; inset: 0; display: block;
    -webkit-mask-image: var(--mascot-mark); mask-image: var(--mascot-mark);
    -webkit-mask-mode: luminance; mask-mode: luminance;
    -webkit-mask-size: contain; mask-size: contain;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: center; mask-position: center; }
  /* The floor: same stock, pressed. */
  .apoyu-back__mark .apoyu-deboss__floor { background:
      linear-gradient(118deg, rgba(255,236,214,0) 36%, rgba(255,236,214,.06) 50%, rgba(255,236,214,0) 64%),
      linear-gradient(180deg, rgba(0,0,0,.30) 0%, rgba(0,0,0,.14) 50%, rgba(0,0,0,.06) 100%); }
  /* The rims exist only where a browser can subtract one mask from another; elsewhere the floor
     alone still reads as a pressed mark rather than two full silhouettes of light and shade. */
  @supports (mask-composite: subtract) or (-webkit-mask-composite: source-out) {
    .apoyu-back__mark .apoyu-deboss__rim {
      -webkit-mask-image: var(--mascot-mark), var(--mascot-mark); mask-image: var(--mascot-mark), var(--mascot-mark);
      -webkit-mask-mode: luminance, luminance; mask-mode: luminance, luminance;
      -webkit-mask-size: contain, contain; mask-size: contain, contain;
      -webkit-mask-repeat: no-repeat, no-repeat; mask-repeat: no-repeat, no-repeat;
      -webkit-mask-composite: source-out; mask-composite: subtract; }
    /* the wall in shadow under the light: the mark minus itself shifted down */
    .apoyu-back__mark .apoyu-deboss__wall { background: rgba(0,0,0,.66);
      -webkit-mask-position: center, calc(50% + var(--dx)) calc(50% + var(--dy));
      mask-position: center, calc(50% + var(--dx)) calc(50% + var(--dy)); }
    /* the far lip catching the light: the mark minus itself shifted up */
    .apoyu-back__mark .apoyu-deboss__lip { background: rgba(255,228,200,.27);
      -webkit-mask-position: center, calc(50% - var(--dx)) calc(50% - var(--dy));
      mask-position: center, calc(50% - var(--dx)) calc(50% - var(--dy)); }
    /* the stock lifting a hair around the recess: the shifted mark minus the mark */
    .apoyu-back__mark .apoyu-deboss__ridge-lit { background: rgba(255,228,200,.09);
      -webkit-mask-position: calc(50% - var(--dx)) calc(50% - var(--dy)), center;
      mask-position: calc(50% - var(--dx)) calc(50% - var(--dy)), center; }
    .apoyu-back__mark .apoyu-deboss__ridge-shade { background: rgba(0,0,0,.14);
      -webkit-mask-position: calc(50% + var(--dx)) calc(50% + var(--dy)), center;
      mask-position: calc(50% + var(--dx)) calc(50% + var(--dy)), center; }
  }
  @media (prefers-reduced-motion: reduce) { .apoyu-flip { transition: none; } }

  @media (min-width: 900px) {
    /* Card and copy are one gathered group, centred as a pair, so the instruction shares a gaze
       with the thing it instructs and the reveal does not land in a corner. */
    .apoyu-pull { grid-template-columns: auto minmax(0, 30rem); grid-template-areas: "card copy";
      align-items: center; text-align: left; justify-items: start; justify-content: center;
      column-gap: clamp(48px, 5.5vw, 88px); min-height: 100svh;
      padding-top: 10vh; padding-bottom: 12vh; }
    .apoyu-pull__copy { justify-items: start; gap: 16px; }
    .apoyu-pull__stage { justify-self: end; }
  }

  /* ── SCENARIO (the deep of the night, W3.4) ─────────────────────────────── */
  /* QUESTION → CHOICE → CONSEQUENCE, on one axis on a phone: eyebrow, question, three days, the
     card, then what the day did to it. No background, no divider, no panel: the same room, deeper
     in. On a wide screen the rail (question + days) spans the top and the card takes the left of a
     gathered pair with the consequence beside it — not the Hero's copy/card grid, not the Pull's
     card/copy pair, a stage with its readout. */
  .apoyu-scn { display: grid; grid-template-areas: "rail" "stage" "consequence" "explainer" "close";
    justify-items: center; text-align: center; row-gap: 28px;
    padding-top: clamp(64px, 12vh, 150px); padding-bottom: clamp(88px, 16vh, 190px); }
  .apoyu-scn__rail { grid-area: rail; display: grid; gap: 14px; justify-items: center; width: 100%; }
  .apoyu-scn__question { max-width: 16ch; }
  .apoyu-scn__stage { grid-area: stage; position: relative; display: grid; place-items: center;
    width: var(--scn-card-w); min-height: var(--scn-card-h); }
  .apoyu-scn__consequence { grid-area: consequence; display: grid; gap: 8px; justify-items: center;
    max-width: 30rem; width: 100%; }
  .apoyu-scn__explainer { grid-area: explainer; display: grid; justify-items: center; width: 100%;
    max-width: 30rem; }
  .apoyu-scn__close { grid-area: close; display: grid; gap: 12px; justify-items: center;
    max-width: 30rem; margin-top: 12px; }

  /* THE DAYS. Three objects on the table, not three tiles: a coin with the day's emoji and its name
     beneath, no box around either. The chosen day's coin fills with the fire and a small ember pools
     under it; the others sit in shadow with their names dimmed. Equal columns, so the third day is
     never hidden and nothing scrolls sideways; a wrapping name is a name, not a break. */
  /* Both choice groups are fieldsets (a group of real buttons with one accessible name); the
     browser's fieldset chrome is reset so they lay out as rows. */
  .apoyu-days, .apoyu-finish__row { border: 0; padding: 0; margin: 0; min-width: 0; }
  .apoyu-days { display: flex; gap: 6px; width: 100%; max-width: 440px; margin-top: 6px; }
  .apoyu-day { appearance: none; flex: 1 1 0; min-width: 0; cursor: pointer; position: relative;
    display: grid; justify-items: center; gap: 9px; padding: 10px 4px 8px; border-radius: 18px;
    font: inherit; color: var(--ink-dim); background: none; border: 0;
    transition: color 220ms ease; }
  .apoyu-day:focus-visible { outline: 2px solid #FFD9A8; outline-offset: 2px; }
  /* The ember under the chosen coin: stage light, blurred, only there when the day is chosen. */
  .apoyu-day::before { content: ''; position: absolute; left: 50%; top: 34px; width: 92px; height: 44px;
    transform: translateX(-50%); border-radius: 50%; pointer-events: none; filter: blur(12px);
    background: radial-gradient(ellipse at 50% 50%, rgba(255,150,62,.42) 0%, rgba(230,110,44,.14) 46%, rgba(160,60,30,0) 72%);
    opacity: 0; transition: opacity 260ms ease; }
  .apoyu-day__coin { position: relative; width: 46px; height: 46px; border-radius: 50%; display: grid;
    place-items: center; font-size: 23px; line-height: 1;
    background: radial-gradient(circle at 50% 28%, rgba(255,236,214,.14), rgba(255,236,214,0) 66%),
      linear-gradient(180deg, #33243F 0%, #221730 100%);
    box-shadow: 0 0 0 1px rgba(255,220,180,.22) inset, 0 1px 0 rgba(255,255,255,.06) inset,
      0 8px 18px -10px rgba(0,0,0,.9);
    transition: background 220ms ease, box-shadow 220ms ease, transform 220ms ease; }
  .apoyu-day:hover .apoyu-day__coin { box-shadow: 0 0 0 1px rgba(255,220,180,.4) inset, 0 1px 0 rgba(255,255,255,.08) inset, 0 8px 18px -10px rgba(0,0,0,.9); }
  .apoyu-day:active .apoyu-day__coin { transform: scale(.96); }
  .apoyu-day__label { font-size: 12.5px; font-weight: 600; line-height: 1.2; letter-spacing: .005em;
    text-wrap: balance; color: #BDB0A4; }
  .apoyu-day.is-selected { color: var(--ink); }
  .apoyu-day.is-selected::before { opacity: 1; }
  .apoyu-day.is-selected .apoyu-day__coin { transform: translateY(-2px);
    background: radial-gradient(circle at 50% 28%, #FFD9A8 0%, var(--ember) 46%, var(--ember-deep) 100%);
    box-shadow: 0 0 0 1px rgba(255,255,255,.26) inset, 0 10px 22px -8px rgba(255,140,50,.75); }
  .apoyu-scn__day { margin: 0; color: var(--ink-dim); font-size: 15px; font-style: italic;
    line-height: 1.4; max-width: 34ch; text-wrap: balance; transition: opacity 140ms ease; }
  .apoyu-scn__day.is-changing { opacity: 0; }

  /* THE STAGE. The fire under the card follows the recovery: `--recovery` is the committed score
     as 0..1, and the pool's strength rides it — banked at 12, full at 92. Stage light, not card
     chrome; the same ember pool the Hero stands on, answering the day. */
  .apoyu-scn__light { position: absolute; left: -24%; right: -24%; bottom: -14%; height: 64%;
    pointer-events: none; z-index: 0; filter: blur(24px);
    opacity: calc(0.28 + var(--recovery, 0.5) * 0.72);
    background: radial-gradient(ellipse at 50% 96%,
      rgba(255, 146, 58, .34) 0%, rgba(230, 110, 44, .15) 38%, rgba(160, 60, 30, 0) 72%);
    transition: opacity 260ms ease; }
  .apoyu-scn__slot { width: var(--scn-card-w); height: var(--scn-card-h); border-radius: 5.6%; }
  /* The canonical poster in the card's shape until the exact card has it (WEB-74 on this beat). */
  .apoyu-scn__poster { position: absolute; top: 0; left: 0; width: var(--scn-card-w);
    height: var(--scn-card-h); object-fit: cover; border-radius: 5.6%; z-index: 3;
    pointer-events: none; box-shadow: 0 34px 70px -28px rgba(0,0,0,.9), 0 0 0 1px rgba(255,220,180,.06); }
  .apoyu-scn__stage .apoyu-cardstage--bare { position: relative; z-index: 1; }

  /* THE CONSEQUENCE. A caption, the score in the card's own face, the material it forged. */
  .apoyu-readout { margin: 0; display: flex; align-items: baseline; gap: 10px; line-height: 1;
    font-family: 'Fredoka-SemiBold', ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; }
  .apoyu-readout__score { font-size: 46px; font-weight: 600; color: var(--ink); letter-spacing: -.01em;
    font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; }
  .apoyu-readout__sep { color: var(--ink-dim); font-size: 22px; }
  .apoyu-readout__material { font-size: 15px; letter-spacing: .16em; color: var(--ember);
    font-weight: 600; }
  .apoyu-scn__note { margin: 0; color: var(--ink-dim); font-size: 14px; line-height: 1.5;
    max-width: 36ch; text-wrap: balance; }

  /* THE FINISH. A line that says what the row is for, then four finish tokens in the days' own
     vocabulary: a swatch above, its name below, no box. The swatch is a hint of the finish family
     (matte, satin, foil, laminate); the CARD is where the finish actually answers, under the light. */
  .apoyu-finish { display: grid; gap: 8px; justify-items: center; width: 100%; margin-top: 30px; }
  .apoyu-finish__head { margin: 0; font-size: 18px; font-weight: 600; color: var(--ink);
    font-family: 'Fredoka-SemiBold', ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; }
  .apoyu-finish__support { margin: 0; color: var(--ink-dim); font-size: 14px; line-height: 1.45; }
  .apoyu-finish__row { display: flex; gap: 4px; width: 100%; max-width: 380px; margin-top: 4px; }
  .apoyu-finish__tier { appearance: none; flex: 1 1 0; min-width: 0; cursor: pointer;
    display: grid; justify-items: center; gap: 7px; padding: 8px 2px 6px; border-radius: 14px;
    font: inherit; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; color: var(--ink-dim);
    background: none; border: 0; transition: color 200ms ease; }
  .apoyu-finish__tier:focus-visible { outline: 2px solid #FFD9A8; outline-offset: 2px; }
  .apoyu-finish__tier.is-selected { color: var(--ink); }
  .apoyu-finish__swatch { width: 30px; height: 20px; border-radius: 6px; display: block;
    box-shadow: 0 0 0 1px rgba(255,220,180,.14) inset, 0 6px 14px -8px rgba(0,0,0,.9);
    transition: box-shadow 200ms ease, transform 200ms ease; }
  .apoyu-finish__tier:hover .apoyu-finish__swatch { box-shadow: 0 0 0 1px rgba(255,220,180,.28) inset, 0 6px 14px -8px rgba(0,0,0,.9); }
  .apoyu-finish__tier.is-selected .apoyu-finish__swatch { transform: translateY(-1px);
    box-shadow: 0 0 0 1.5px rgba(255,178,92,.85) inset, 0 8px 18px -8px rgba(255,140,50,.55); }
  /* Every finish is the same card stock; what differs is how it catches a light. Common: none.
     Uncommon: a faint satin band. Rare: a brighter band with a spectral edge. Legendary: a fine
     spectral band. The same stock, the same diagonal the card's own sweep travels. */
  .apoyu-finish__swatch { background: linear-gradient(160deg, #2F2639 0%, #1C1526 100%); }
  .apoyu-finish__swatch.is-uncommon { background:
      linear-gradient(115deg, rgba(255,240,222,0) 36%, rgba(255,240,222,.22) 50%, rgba(255,240,222,0) 64%),
      linear-gradient(160deg, #2F2639 0%, #1C1526 100%); }
  .apoyu-finish__swatch.is-rare { background:
      linear-gradient(115deg, rgba(255,120,170,0) 41%, rgba(255,120,170,.35) 45%, rgba(255,246,236,.55) 50%, rgba(120,200,255,.35) 55%, rgba(120,200,255,0) 59%),
      linear-gradient(160deg, #2F2639 0%, #1C1526 100%); }
  .apoyu-finish__swatch.is-legendary { background:
      linear-gradient(115deg, rgba(242,196,196,0) 30%, rgba(242,196,196,.8) 38%, rgba(245,226,184,.85) 44%, rgba(201,240,214,.85) 50%, rgba(191,217,247,.85) 56%, rgba(227,198,245,.8) 62%, rgba(227,198,245,0) 70%),
      linear-gradient(160deg, #2F2639 0%, #1C1526 100%); }

  /* HOW DOES APOYÜ GET THE SCORE? Collapsed by default; the privacy line never hides. */
  .apoyu-disclosure { display: grid; gap: 10px; justify-items: center; width: 100%; }
  .apoyu-disclosure__button { appearance: none; cursor: pointer; display: inline-flex;
    align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px; font: inherit;
    font-size: 13.5px; font-weight: 600; color: var(--ink-dim); background: none;
    border: 1px solid rgba(255,220,180,.14); transition: border-color 200ms ease, color 200ms ease; }
  .apoyu-disclosure__button:hover { color: var(--ink); border-color: rgba(255,220,180,.28); }
  .apoyu-disclosure__button:focus-visible { outline: 2px solid #FFD9A8; outline-offset: 3px; }
  .apoyu-disclosure__sign { color: var(--ember); font-size: 15px; font-weight: 700; }
  .apoyu-scn__privacy { margin: 0; color: var(--ink-dim); font-size: 13px; }
  .apoyu-disclosure__body { width: 100%; max-width: 26rem; text-align: left; display: grid; gap: 6px;
    margin-top: 4px; }
  .apoyu-disclosure__heading { margin: 10px 0 2px; font-size: 11px; letter-spacing: .16em;
    color: var(--ember); font-weight: 700; }
  .apoyu-signals { margin: 0; display: grid; gap: 8px; }
  .apoyu-signals__row dt { font-size: 12.5px; font-weight: 700; letter-spacing: .06em; color: var(--ink); }
  .apoyu-signals__row dd { margin: 2px 0 0; font-size: 13px; line-height: 1.45; color: var(--ink-dim); }
  .apoyu-disclosure__text { margin: 0; font-size: 13px; line-height: 1.45; color: var(--ink-dim); }
  .apoyu-disclosure__fine { margin: 6px 0 0; font-size: 12.5px; line-height: 1.45; color: var(--ink-dim);
    opacity: .8; }

  .apoyu-scn__closing { margin: 0; color: var(--ink); font-size: 17px; font-style: italic; line-height: 1.4; }
  .apoyu-scn__deck { margin: 0; color: var(--ink-dim); font-size: 14px; line-height: 1.5; max-width: 34ch;
    text-wrap: balance; }

  @media (prefers-reduced-motion: reduce) {
    .apoyu-day, .apoyu-day::before, .apoyu-day__coin, .apoyu-finish__tier, .apoyu-finish__swatch,
    .apoyu-scn__day, .apoyu-scn__light, .apoyu-disclosure__button { transition: none; }
  }

  @media (min-width: 600px) {
    .apoyu-days { max-width: 500px; gap: 8px; }
    .apoyu-day__label { font-size: 13.5px; }
    .apoyu-finish__row { max-width: 420px; }
    .apoyu-finish__tier { font-size: 11px; }
  }
  @media (min-width: 1000px) {
    /* The rail spans; beneath it the card and its consequence are one gathered pair, centred. */
    .apoyu-scn { grid-template-columns: auto minmax(0, 26rem); grid-template-areas: "rail rail"
      "stage consequence" "explainer explainer" "close close"; align-items: center;
      justify-content: center; column-gap: clamp(44px, 5vw, 92px); row-gap: 22px;
      padding-top: clamp(28px, 4vh, 56px); padding-bottom: clamp(72px, 12vh, 150px); }
    .apoyu-scn__rail { justify-self: center; gap: 10px; }
    .apoyu-scn__explainer { justify-self: center; margin-top: 14px; }
    .apoyu-disclosure { justify-items: center; }
    .apoyu-disclosure__body { max-width: 30rem; }
    .apoyu-scn__question { max-width: 26ch; }
    .apoyu-days { max-width: 520px; }
    .apoyu-scn__consequence { justify-items: start; text-align: left; gap: 10px; }
    .apoyu-scn__note, .apoyu-finish__support, .apoyu-scn__deck { text-wrap: pretty; }
    .apoyu-finish { justify-items: start; }
    .apoyu-finish__row { max-width: 400px; }
    .apoyu-readout__score { font-size: 54px; }
    .apoyu-scn__close { justify-self: center; }
  }

  /* ── THE DAILY LOOP (W3.5) ──────────────────────────────────────────────── */
  /* THE CARD IS THE READ; THIS IS WHAT TO DO WITH IT. Two surfaces, deliberately unequal: the
     CALL is a wide illustrated instrument (how hard do I go today?), the NUDGE is a small
     concrete card set down after it (what is the one thing?). No section background, no divider,
     no panel — the same room, one beat further into the night. There is nothing to press here.

     🔴 NOT TWO EQUAL FEATURE CARDS. On a phone they run down one axis, the Nudge narrower than
     the Call and inset from the same left edge, so the size difference IS the hierarchy. On a
     desktop they are a gathered pair on a table: the Call takes the larger mass, the Nudge sits
     smaller, lower and downstream of it, sharing a light rather than a grid row. */
  .apoyu-loop { display: grid; grid-template-areas: "rail" "call" "then" "nudge";
    justify-items: center; row-gap: 18px;
    padding-top: clamp(40px, 8vh, 96px); padding-bottom: clamp(72px, 14vh, 160px); }
  .apoyu-loop__rail { grid-area: rail; display: grid; gap: 14px; justify-items: center;
    text-align: center; width: 100%; margin-bottom: 10px; }
  .apoyu-loop__headline { max-width: 20ch; }
  .apoyu-loop__support { max-width: 38ch; }
  .apoyu-loop__call { grid-area: call; width: 100%; max-width: 560px; }
  .apoyu-loop__nudge { grid-area: nudge; width: 100%; max-width: 560px; }
  /* The two surface titles sit OUTSIDE their frames, in ash rather than ember, exactly as the
     app stacks them: eyebrow, frame, eyebrow, frame down the scroll. Ember is spent on the one
     section eyebrow above; a second ember label here would make three eyebrows compete. */
  .apoyu-loop__label { margin: 0 0 8px 4px; font-size: 10px; letter-spacing: .2em;
    line-height: 14px; color: rgba(163,154,142,.90); font-weight: 700; text-align: left;
    font-family: 'Fredoka-Bold', 'Fredoka-SemiBold', ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; }

  /* THE SEQUENCING CUE. One quiet word between two ember traces — not a stepper, not a timeline,
     not a numbered process. It says "and then this" and takes 14 px of the page to do it. */
  /* 🔴 IT IS THE ONLY THING SAYING THE CALL CAUSES THE NUDGE, so it has to be readable: at
     rgba(163,154,142,.62) it measured 3.4:1 on this ground, under the 4.5:1 bar for 10 px text. */
  .apoyu-loop__then { grid-area: then; margin: 2px 0; display: flex; align-items: center; gap: 12px;
    font-size: 10px; letter-spacing: .28em; font-weight: 700; color: rgba(214,205,193,.82); }
  .apoyu-loop__trace { display: block; width: clamp(28px, 9vw, 54px); height: 1px;
    background: linear-gradient(90deg, rgba(255,170,120,0) 0%, rgba(255,170,120,.42) 50%, rgba(255,170,120,0) 100%); }

  /* ── TODAY'S CALL ───────────────────────────────────────────────────────────
     `CallScene`'s composition, restated in CSS: a full-width frame with the delivered artboard
     underneath taking 61 % of it, the information floating on top from the halfway mark, and a
     directional scrim carrying the contrast between them. 236 px is the app's own BASE_HEIGHT and
     is a FLOOR here too — the frame grows with its content and never clips a line. Every colour
     is a custom property written by `DailyLoop.tsx` from `call-scene-ink.ts`. */
  /* 🔴 THE FRAME'S HEIGHT TRACKS ITS OWN WIDTH, AND THAT IS THE WHOLE RESPONSIVE RULE.
     On device the frame is ~342 x 236: the board contains to 189 px, which reaches PAST the point
     the copy starts (50 %), so the art runs under the words and the scrim dissolves it. Hold the
     236 floor while the frame widens and that stops being true — at 768 the frame is 558 wide, the
     board is still 189, and a 90 px band of bare room opens between the picture and the text. That
     is the filmstrip-thumbnail-glued-to-a-UI-card failure `CallScene`'s own header describes, and
     it appeared on the first tablet capture. 68.75 % is the device ratio (0.8 x 0.55 x width), so
     one container query keeps the overlap at every width; 236 stays the floor and 384 the cap, and
     a browser without container queries simply keeps the floor. */
  /* ── THE FOUR-CALL SELECTOR (W3.5.1) ──────────────────────────────────────
     The beat's ONE control, and the only focusable thing in it. Real radios, visually hidden, with
     the <label> as the target — so arrow keys, Home/End and the "radio button, 2 of 4" announcement
     are the browser's, not a re-implementation of them.

     🔴 ALL FOUR FIT AT 390, WITHOUT SCROLLING, AND THE TARGET IS STILL 44px. Four equal columns of
     a container that is already `max-width: 560px` and gutter-inset: at 390 the beat's rail leaves
     ~342px, so each option is ~81px wide against a 44px minimum, and `min-height: 44px` holds the
     other axis. No horizontal scroller, no overflow, no shrink-to-fit type.

     🔴 SELECTED IS NEVER COLOUR ALONE. Ink AND weight lift, an ember underline appears, and the
     chip gains a lit rim: three redundant cues, so the state survives greyscale entirely. */
  .apoyu-callpick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;
    margin: 0 0 10px; padding: 0; border: 0; }
  .apoyu-callpick__opt { display: block; min-width: 0; }
  .apoyu-callpick__label { display: flex; align-items: center; justify-content: center;
    min-height: 44px; padding: 6px 4px 5px; border-radius: 12px; cursor: pointer;
    position: relative; font-size: 12.5px; letter-spacing: .06em; line-height: 16px;
    color: rgba(163,154,142,.92); font-weight: 600;
    border: 1px solid rgba(240,236,227,.08); background: rgba(240,236,227,.028);
    font-family: 'Fredoka-SemiBold', ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif;
    transition: color 200ms ease, background-color 200ms ease, border-color 200ms ease; }
  /* Cue 1 + 2: the chosen word is brighter AND heavier, and its chip is lit. */
  .apoyu-callpick__label[data-on] { color: #F0ECE3; font-family: 'Fredoka-Bold', 'Fredoka-SemiBold', ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif;
    background: rgba(255,179,102,.10); border-color: rgba(255,179,102,.38); }
  /* Cue 3: an ember underline that exists only on the chosen one, so greyscale still reads. */
  .apoyu-callpick__label[data-on]::after { content: ''; position: absolute; left: 26%; right: 26%;
    bottom: 5px; height: 2px; border-radius: 2px; background: rgba(255,179,102,.92); }
  @media (hover: hover) { .apoyu-callpick__label:hover { color: #E4DED2; background: rgba(240,236,227,.06); } }
  /* The focus ring rides the LABEL, because the input it belongs to is visually hidden. */
  .apoyu-callpick__input:focus-visible + .apoyu-callpick__label {
    outline: 2px solid rgba(255,179,102,.9); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .apoyu-callpick__label { transition: none; } }

  .apoyu-loop__call { container-type: inline-size; }
  .apoyu-call { position: relative; min-height: 236px; border-radius: 24px; overflow: hidden;
    border: 1px solid var(--call-rim); background: var(--call-scrim); display: flex; }
  .apoyu-call { min-height: clamp(236px, 68.75cqw, 384px); }
  /* The room: ground, the hearth's wide faint spread, the hearth itself under the art zone, the
     floor hairline at 0.84, and a corner vignette. Five layers, one element, no canvas. */
  /* Every radius below is `PlaceholderField`'s own arithmetic resolved against the FRAME rather
     than against the art stage, because CSS has no `artStageWidth`: the stage is 0.61 of the frame,
     so the tight hearth's `artStageWidth * 0.95` is 57.95 % of the frame, the wide spread's
     `artStageWidth * 2.6` is 158.6 %, and the emitter's `artStageWidth * 0.44` is 26.8 % across.
     Each is then multiplied by the call's own `reach`, exactly as the app multiplies it. */
  .apoyu-call__room { position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 50% 50% at 50% 50%, rgba(0,0,0,0) 55%,
        color-mix(in srgb, var(--call-vignette) 55%, transparent) 100%),
      linear-gradient(to bottom, transparent calc(84% - 1px),
        color-mix(in srgb, var(--call-hearth) calc(var(--call-hearth-a) * 55%), transparent) 84%,
        transparent calc(84% + 1px)),
      radial-gradient(ellipse calc(57.95% * var(--call-hearth-reach)) calc(72% * var(--call-hearth-reach)) at 26.8% 102%,
        color-mix(in srgb, var(--call-hearth) calc(var(--call-hearth-a) * 100%), transparent) 0%,
        color-mix(in srgb, var(--call-hearth) calc(var(--call-hearth-a) * 40%), transparent) 55%,
        transparent 100%),
      radial-gradient(ellipse calc(158.6% * var(--call-hearth-reach)) calc(105% * var(--call-hearth-reach)) at 26.8% 102%,
        color-mix(in srgb, var(--call-hearth) calc(var(--call-hearth-a) * 34%), transparent) 0%,
        transparent 100%),
      linear-gradient(180deg, var(--call-ground-0) 0%, var(--call-ground-1) 50%, var(--call-ground-2) 100%); }
  /* The art stage: a VISUAL footprint, never a layout column — nothing lays out against it and the
     copy overlaps it freely. `ART_STAGE_FRACTION` is 0.61 in `CallScene.tsx`.

     🔴 RETIRED BY WEB-120, RECORDED SO IT IS NOT REINSTATED. W3.5 moved the app's ramp off the
     stage and onto the BOARD, on the strength of a desktop measurement — "at 1440 the frame is
     603x300, the board contains to 240 of a 368 px stage, and a 0.88-of-stage ramp reached the
     board's edge only 38 % faded". That frame no longer exists: the Call is 534x367 at 1440 today
     and `min-height: 68.75cqw` pins board/stage at 0.902 everywhere, so the premise is gone while
     the workaround it justified stayed and quietly cropped the artwork. The board keeps its own box
     — sized by the real 449:561 ratio and pinned bottom-left exactly as `Fit.Contain` +
     `Alignment.BottomLeft` place it — but the DISSOLVE goes back where the app writes it. */
  /* 🔴 THE FEATHER RIDES THE STAGE, BECAUSE THAT IS THE COORDINATE SYSTEM IT IS WRITTEN IN
     (WEB-120, W3.5.1.3 — the founder's "the right side of the artwork seems cropped").

     `CallSceneArt` puts its dissolve on a View of `width: artStageWidth` and runs the ramp
     0 / 0.52 / 0.76 / 0.88 across THAT. W3.5 kept the numbers but moved them onto the BOARD, which
     is narrower than the stage — so every stop landed early and the illustrated room stopped
     reading well before the app's does. Measured on the founder's own build at 390: 0.52 at 97.4 px
     instead of 107.8, 0.76 at 142.3 instead of 157.6, and full transparency at 164.8 instead of
     182.5 — the artwork gone 17.7 px early, which on a 187 px illustration is what turned the
     app's fully-lit REST MODE mug into a ghost. The stops were never the problem; the box they were
     measured against was.

     🔴 AND THE DISSOLVE STAYS THE PANEL'S OWN ALPHA, NOT A COLOUR LAID OVER IT. The app paints
     `CALL_ROOM_EDGE` at rising opacity because a native Image cannot be masked in place; a browser
     can, and painting a FLAT colour over a room that is a vertical gradient leaves a step wherever
     the two disagree — measured at 22,13,32 against 28,15,31, a 27 % relative difference at
     near-black and a faint vertical line down the card. Fading alpha instead reveals whatever the
     room actually is at that pixel. That was W3.5's one real adaptation and it is kept; only the
     box it is measured against is corrected. Masking the STAGE also makes poster/live parity
     structural rather than duplicated: both live inside this element, so the hand-off cannot
     change the crop.

     🔴 WHY NO TERMINAL ANTI-SEAM FEATHER IS NEEDED, AND IT IS ARITHMETIC RATHER THAN LUCK. The old
     rule existed because a stage ramp once reached the board's edge only 38 % faded on desktop. It
     cannot any more: `board / stage = (h x 449/561) / (0.61 w)`, and `min-height: 68.75cqw` pins
     `h/w`, so the ratio is `1.3121 x 0.6875 = 0.902` at every width the card can produce (measured
     0.9030 at 390, 0.9005 at 1440). 0.902 > 0.88, so the ramp reaches full transparency 4.8 px
     inside the artwork at 390 and 6.6 px inside it at 1440. The board's literal edge is already
     invisible before it arrives, at any viewport. */
  .apoyu-call__panel { position: absolute; left: 0; top: 0; bottom: 0; width: 61%;
    pointer-events: none;
    -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 52%, rgba(0,0,0,.30) 76%, transparent 88%);
    mask-image: linear-gradient(90deg, #000 0%, #000 52%, rgba(0,0,0,.30) 76%, transparent 88%); }
  .apoyu-call__board { position: absolute; left: 0; bottom: 0; height: 100%; width: auto;
    max-width: 100%; aspect-ratio: 449 / 561; display: block; }
  .apoyu-call__art { position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; object-position: left bottom; }
  /* 🔴 THE POSTER HANDS OFF; IT DOES NOT SIT BEHIND (W3.5.1.1). W3.5.1 left the still mounted and
     fully visible under the live canvas, and a Rive canvas is transparent wherever its artboard
     does not paint — so the frozen still showed THROUGH the live scene, and because the live art
     does not cover the still's whole footprint its top band read as a second, dimmer ceiling. That
     is the duplicated strip the founder reported. Proven by hiding only the poster in the running
     page, which removed it entirely.

     The asymmetry is deliberate. GOING (the attribute arrives, the live world is proven): a short
     fade, then `visibility: hidden` at the END of it, so the poster contributes exactly zero pixels
     rather than a permanent 5 %. RETURNING (the attribute leaves, on a call switch or offscreen):
     INSTANT — the base rule declares no transition, so there is never a window with the poster
     faded and the new world not yet up. No blank frame, ever, in either direction. Geometry never
     moves: the same box, the same object-fit, the same mask. */
  .apoyu-call__art { transition: none; }
  .apoyu-call__art[data-handed-off='1'] { opacity: 0; visibility: hidden;
    transition: opacity 120ms linear, visibility 0s linear 120ms; }
  @media (prefers-reduced-motion: reduce) {
    .apoyu-call__art[data-handed-off='1'] { transition: none; }
  }
  /* 🔴 THE LIVE ARTBOARD SHARES THE STILL'S BOX EXACTLY (W3.5.1), which is what makes the handoff
     invisible: same 449:561 footprint, same bottom-left pin, same alpha feather, so the canvas
     draws over the poster pixel for pixel and nothing reflows, shifts or flashes. The canvas is a
     child of the same `.apoyu-call__board` span and simply fills it. */
  .apoyu-call__board > div { position: absolute; inset: 0; }

  /* HOLD and PUSH: no delivered artboard, so the app's OWN stand-in subject stands in the room.
     The frame is the full Call, and the orb is placed inside it by `PlaceholderField`'s arithmetic
     measured at runtime (the height is a container query, so there is no constant to read). */
  .apoyu-call__standin { position: absolute; inset: 0; pointer-events: none; }
  .apoyu-call__standin-floor { position: absolute; left: 0; right: 0; bottom: 0; opacity: .6;
    pointer-events: none; }
  /* Clear over Apoyü, climbing hard through the transition so the first character already sits on
     contrast, and never reaching opaque so the hearth stays faintly readable behind the words. */
  .apoyu-call__scrim { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(90deg,
      color-mix(in srgb, var(--call-scrim) 0%, transparent) 0%,
      color-mix(in srgb, var(--call-scrim) 10%, transparent) 34%,
      color-mix(in srgb, var(--call-scrim) 65%, transparent) 52%,
      color-mix(in srgb, var(--call-scrim) 91%, transparent) 70%,
      color-mix(in srgb, var(--call-scrim) 95%, transparent) 100%); }
  /* A shallow lift along the floor, so the scene has weight at its bottom edge. */
  .apoyu-call__floor { position: absolute; left: 0; right: 0; bottom: 0; height: 84px;
    pointer-events: none;
    background: linear-gradient(180deg, color-mix(in srgb, var(--call-scrim) 0%, transparent) 0%,
      color-mix(in srgb, var(--call-scrim) 20%, transparent) 100%); }
  /* A MARGIN, not a column (`INFO_LEFT_FRACTION` 0.5 < `ART_STAGE_FRACTION` 0.61): the art behind
     it is untouched, and the two are never tiling the frame. */
  .apoyu-call__info { position: relative; z-index: 1; margin-left: 50%; padding: 20px 20px 20px 0;
    display: grid; align-content: center; flex-grow: 1; }
  .apoyu-call__read { display: grid; gap: 20px; }
  .apoyu-call__meter { width: 100%; }
  .apoyu-call__words { display: grid; gap: 8px; }
  /* THE LARGEST LINE IN THE SCENE. 20/26 Fredoka Medium, the app's own values — the meter already
     carries the verdict word and a second giant EASE beneath it would be the same thing twice. */
  .apoyu-call__prescription { margin: 0; font-size: 20px; line-height: 26px; color: #F0ECE3;
    font-family: 'Fredoka-Medium', 'Fredoka-SemiBold', ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; }
  /* One concise, deterministic reason. `theme.type.footnote`: 12/17. */
  .apoyu-call__reason { margin: 0; font-size: 12px; line-height: 17px; color: #A39A8E;
    font-family: 'Fredoka-Variable', ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; }

  /* ── TODAY'S NUDGE ────────────────────────────────────────────────────────
     The frame, the band, the emblem, the target and the sentence are the APP'S OWN COMPONENTS
     running through react-native-web; this rule only decides how wide the card is. It is
     deliberately narrower than the Call and inset from its left edge, so the pair reads as a
     large decision followed by a small move rather than as two products side by side. */
  /* 🔴 SMALLER BY WIDTH, NEVER BY AN INSET. An inset card put its own eyebrow outside it (the label
     sat up to 29 px left of the thing it labelled) and gave the beat three different left edges in
     one column. Both surfaces and both labels now share the beat's own left edge, and the Nudge is
     subordinate because it is narrower and shorter — which is the honest signal anyway. */
  .apoyu-nudge { width: 88%; max-width: 420px; }
  @media (max-width: 420px) { .apoyu-nudge { width: 92%; } }

  /* 🔴 THE STACKED RANGE STAYS A COLUMN. Left to fill a tablet, the Call reached 560 x 384 while
     its copy collapsed to one line each, leaving a 253 x 140 unlit rectangle in the lower right
     that reads as content that failed to load. A gathered column is also what the Scenario above
     does at this width, so the two beats agree about what a tablet is. */
  @media (min-width: 640px) and (max-width: 999px) {
    .apoyu-loop__label { font-size: 10.5px; }
    .apoyu-loop__call, .apoyu-loop__nudge { max-width: 452px; }
    .apoyu-call__read { gap: 22px; }
    .apoyu-call__prescription { font-size: 22px; line-height: 28px; }
    .apoyu-call__reason { font-size: 13px; line-height: 18px; }
  }

  /* THE MORNING TABLETOP. The rail spans; beneath it the Call takes the larger mass on the left
     and the Nudge is set DOWN after it, smaller and to the right, with the sequencing cue turned on
     its side between them. Related by sequence, not boxed for comparison: the pair is gathered
     (a capped, centred width) rather than pushed to the two ends of a wide row, and the Nudge's
     vertical offset is deep enough that the two never read as one grid line. */
  @media (min-width: 1000px) {
    /* Wider than the tablet column, or the beat's own instrument would be SMALLER on a monitor than
       on a tablet — measured, 253 px of art at 1440 against 306 at 768, which is the wrong way
       round for the page's fourth object. */
    .apoyu-loop { grid-template-columns: minmax(0, 1.52fr) auto minmax(0, 1fr);
      grid-template-areas: "rail rail rail" "call then nudge";
      align-items: start; justify-content: center; column-gap: clamp(18px, 2.2vw, 30px);
      row-gap: 24px; max-width: 1140px;
      padding-top: clamp(48px, 8vh, 110px); padding-bottom: clamp(88px, 14vh, 170px); }
    /* 🔴 FLUSH TO THE CALL, NOT CENTRED IN THE ROW. The base rule centres every item, so a rail
       with a 34 rem measure landed 170 px right of the cards and aligned to nothing — and its right
       edge missed the Nudge column by 11 px, which reads as a failed alignment rather than an
       offset. The beat has ONE left spine and everything sits on it. */
    .apoyu-loop__rail { justify-self: start; justify-items: start; text-align: left;
      max-width: 34rem; margin-bottom: 18px; }
    .apoyu-loop__headline { max-width: 22ch; }
    .apoyu-loop__call { max-width: none; align-self: start; }
    /* The reading side grows with the frame, or a 24 px prescription would be marooned in the
       middle of a 360 px box: the app's 20/26 is a phone number, and every other line on this page
       already scales with the viewport. The ratio to the meter's 10 px chrome is held near the
       device's own 2:1 by capping it at 24. */
    .apoyu-call__read { gap: clamp(20px, 2.4vh, 26px); }
    .apoyu-call__meter { max-width: 320px; }
    .apoyu-call__prescription { font-size: clamp(20px, 1.5vw, 24px); line-height: 1.3; }
    .apoyu-call__reason { font-size: clamp(12px, .95vw, 13.5px); line-height: 1.42; }
    /* 🔴 THE TWO OBJECTS REST ON ONE SURFACE. A fixed offset left their bottom edges 10 to 15 px
       apart at the two desktop sizes — near enough to read as a missed alignment. `align-self: end`
       flushes them exactly at every viewport, and the stagger that produces (the height difference,
       ~150 px) is the "set down after it" the composition wanted in the first place. */
    .apoyu-loop__nudge { max-width: none; align-self: end; }
    .apoyu-nudge { width: 100%; max-width: 340px; }
    /* Horizontal, seated between the two cards. Rotated 10 px text in a gutter reads as a stray
       mark, not as a word — and this word is the only thing asserting that one causes the other. */
    .apoyu-loop__then { grid-area: then; align-self: center; gap: 10px; letter-spacing: .24em; }
    .apoyu-loop__trace { width: 20px; }
  }

  /* ── THE COLLECTION (blue hour, W3.6 W3A) ─────────────────────────────────
     ONE OBJECT IN FRONT, A SHELF OF SAVED DAYS BEHIND IT. No section background, no rectangle, no
     panel: the same room, with the first cold light in it. On a phone it runs down one axis —
     copy, the promoted card, the shelf, the count — with the shelf overflowing the page's padding
     on purpose, so it visibly continues past the edge of the screen. On a desktop it becomes
     spatial: the card on the left, the copy and a FANNED shelf on the right, cards overlapping the
     way a hand of them would.

     🔴 THE ROW IS NATIVE OVERFLOW, NOT A CUSTOM POINTER LOOP. `touch-action: pan-x pan-y` hands
     horizontal drags to the row and keeps vertical panning for the page, so browsing the shelf and
     scrolling the page never fight. Scroll snapping does the rest. */
  /* 🔴 `minmax(0, 1fr)` IS LOAD-BEARING, NOT TIDINESS. An `auto` column is sized by its items'
     MAX-CONTENT, and the shelf's max-content is the whole row of seven cards (~980 px) — so the
     column grew to fit a row that is supposed to scroll, and `justify-items: center` then centred
     the promoted card in that phantom width and pushed it off the right of a 390 px screen
     (measured: the card's intersection with the viewport was 10 px of its 296). Bounding the column
     to the beat is also what lets the shelf's `100%` resolve at all. */
  .apoyu-col { display: grid; grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "rail" "stage" "shelf" "count";
    justify-items: center; text-align: center; row-gap: 18px;
    padding-top: clamp(40px, 7vh, 110px); padding-bottom: clamp(88px, 16vh, 190px); }
  .apoyu-col__rail { grid-area: rail; display: grid; gap: 10px; justify-items: center; width: 100%; }
  .apoyu-col__headline { max-width: 17ch; }
  .apoyu-col__support { margin: 0; color: var(--ink-dim); font-size: 15px; line-height: 1.5;
    max-width: 34ch; text-wrap: balance; }

  /* THE PROMOTED OBJECT. The still and the exact card occupy the SAME box, so the upgrade from one
     to the other (and the release back) moves nothing on the page. */
  .apoyu-col__stage { grid-area: stage; position: relative; display: grid; place-items: center;
    width: var(--col-card-w); min-height: var(--col-card-h); }
  .apoyu-col__stage:focus { outline: none; }
  .apoyu-col__stage:focus-visible { outline: 2px solid #A8D4FF; outline-offset: 10px;
    border-radius: 12px; }
  .apoyu-col__slot { width: var(--col-card-w); height: var(--col-card-h); border-radius: 5.6%; }
  .apoyu-col__plinth { position: relative; z-index: 1; width: var(--col-card-w); }
  .apoyu-col__still { display: block; width: var(--col-card-w); height: var(--col-card-h);
    border-radius: 5.6%; position: relative; z-index: 1;
    box-shadow: 0 34px 70px -28px rgba(0,0,0,.9), 0 0 0 1px rgba(190,215,255,.07); }
  /* The exact renderer sits exactly over its own still, so the handoff is invisible in both
     directions. It is mounted only while the beat is live, and unmounted (never parked) otherwise. */
  .apoyu-col__exact { position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: grid; place-items: center; z-index: 2; }
  /* THE LAST EMBER, under the card, following its recovery. The room's fire is out by now, so this
     is the only warm source left in the beat — which is exactly the reading the blue hour wants. */
  .apoyu-col__ember { position: absolute; left: -24%; right: -24%; bottom: -12%; height: 58%;
    pointer-events: none; z-index: 0; filter: blur(26px);
    opacity: calc(0.22 + var(--recovery, 0.5) * 0.5);
    background: radial-gradient(ellipse at 50% 96%,
      rgba(255, 146, 58, .26) 0%, rgba(230, 110, 44, .11) 38%, rgba(160, 60, 30, 0) 72%);
    transition: opacity 260ms ease; }

  /* THE SHELF. It breaks the beat's padding so the row runs to the edge of the screen and past it:
     a shelf that stops politely inside a margin reads as a component, not as an archive. */
  /* 🔴 IT BREAKS OUT BY THE BEAT'S OWN PADDING, NOT BY `100vw`. A `100vw` element centred in a
     narrower grid area is positioned by the leftover free space, so its left edge lands wherever
     the arithmetic falls (measured: 12 px, not 0) — and `100vw` also counts a classic scrollbar the
     page does not have. Widening the row by exactly the gutter it must escape is a number that
     cannot drift, and `justify-self: start` is what stops centring from re-introducing the guess. */
  .apoyu-col__shelf { grid-area: shelf; justify-self: start;
    width: calc(100% + 48px); margin-left: -24px; }
  /* 🔴 `scroll-padding-inline` IS NOT OPTIONAL HERE. A snapport is the scroll container's PADDING
     BOX, so `scroll-snap-align: start` under `mandatory` snapping aligns the first tab with the
     container's border edge and instantly scrolls the row 24 px, putting the first card flush
     against the edge of the screen with its frame cut off. `scroll-padding-inline` is what tells
     the snap engine where the page's gutter is. */
  .apoyu-col__row { display: flex; gap: 10px; align-items: flex-start;
    overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory;
    scroll-padding-inline: 24px;
    touch-action: pan-x pan-y; -webkit-overflow-scrolling: touch;
    padding: 8px 24px 14px; scrollbar-width: none; }
  .apoyu-col__row::-webkit-scrollbar { display: none; }
  /* 🔴 A BOX-LESS TABLIST (W3A.1). The scroller owns the geometry, this owns the semantics: the
     six tabs must be flex items of `.apoyu-col__row` itself — same gap, same snapport, same fan —
     so the element that carries `role="tablist"` generates no box of its own. `display: contents`
     is the only thing that adds an ARIA owner without adding a layout box. */
  .apoyu-col__tabs { display: contents; }
  .apoyu-col__tab { appearance: none; border: 0; background: none; padding: 0; margin: 0;
    flex: 0 0 auto; width: var(--col-tile-w, 132px); cursor: pointer; scroll-snap-align: start;
    border-radius: 8px; position: relative; opacity: .92;
    transition: transform 220ms ease, opacity 220ms ease, box-shadow 220ms ease; }
  .apoyu-col__tab--mystery { cursor: default; opacity: .72; }
  .apoyu-col__tile { display: block; width: 100%; height: auto; border-radius: 5.6%;
    box-shadow: 0 14px 30px -16px rgba(0,0,0,.85); }
  .apoyu-col__tile--slot { display: block; width: 100%; aspect-ratio: 2 / 3; border-radius: 5.6%; }
  /* 🔴 THE SELECTED CARD IS LIFTED AND RINGED, NEVER JUST TINTED. Colour alone is not a cue: the
     tab rises 6 px out of the row and takes a cold ring at an offset, which is the same light the
     horizon is casting. Both survive a greyscale screenshot. */
  .apoyu-col__tab.is-selected { opacity: 1; transform: translateY(-6px);
    box-shadow: 0 0 0 2px rgba(168, 212, 255, .82); }
  .apoyu-col__tab:hover { opacity: 1; }
  .apoyu-col__tab:focus-visible { outline: 2px solid #A8D4FF; outline-offset: 4px; }
  @media (prefers-reduced-motion: reduce) {
    .apoyu-col__tab { transition: none; }
    .apoyu-col__ember { transition: none; }
  }

  .apoyu-col__count { grid-area: count; margin: 0; color: var(--ink-dim); font-size: 13px;
    letter-spacing: .01em; }

  /* DESKTOP: the same DOM, a spatial composition. 🔴 NOT THE PHONE CAROUSEL AT 1440 px. The card
     takes the left of the room and the shelf becomes a FAN beside it — the tabs overlap by 28 px
     with a z-stagger, so it reads as a hand of saved days pulled out of a box rather than as a
     product carousel. The selected one comes forward out of the fan. */
  @media (min-width: 900px) {
    .apoyu-col { grid-template-columns: auto minmax(0, 1fr);
      /* The fan is allowed to overflow its column; the row must not be able to widen it. */
      grid-template-areas: "stage rail" "stage shelf" "stage count";
      align-content: center; align-items: center; justify-items: start; text-align: left;
      column-gap: clamp(40px, 5vw, 84px); row-gap: 18px; }
    .apoyu-col__rail { justify-items: start; align-self: end; }
    .apoyu-col__headline { max-width: 15ch; }
    .apoyu-col__support { max-width: 32ch; }
    .apoyu-col__stage { align-self: center; }
    .apoyu-col__shelf { width: auto; max-width: 100%; margin-left: 0; align-self: start; }
    .apoyu-col__row { overflow: visible; scroll-snap-type: none; padding: 14px 0 10px;
      flex-wrap: nowrap; gap: 0; }
    /* 🔴 THE FAN HAS TO FIT THE COLUMN, and at a fixed 150/-28 it did not: seven cards came to 882
       px in an 806 px column, so the mystery tile was sliced in half by the page's own
       `overflow-x: hidden` — clipped rather than scrollable, which is the worst of both. The width
       and the overlap both follow the viewport, so the hand closes as the room narrows instead of
       running off the end of it. */
    .apoyu-col__tab { width: clamp(112px, 10.4vw, 150px);
      margin-left: clamp(-46px, -3.6vw, -28px); }
    .apoyu-col__tab:first-child { margin-left: 0; }
    .apoyu-col__tab:nth-child(1) { z-index: 1; }
    .apoyu-col__tab:nth-child(2) { z-index: 2; }
    .apoyu-col__tab:nth-child(3) { z-index: 3; }
    .apoyu-col__tab:nth-child(4) { z-index: 4; }
    .apoyu-col__tab:nth-child(5) { z-index: 5; }
    .apoyu-col__tab:nth-child(6) { z-index: 6; }
    .apoyu-col__tab:nth-child(7) { z-index: 7; }
    /* 🔴 THE MYSTERY IS STILL THE SEVENTH CARD IN THE FAN. `:nth-child` counts within a PARENT,
       and the mystery's parent is now the scroller rather than the tablist, so it reads as the
       second child and would take the second card's z-index — the hand would fan the wrong way at
       one end. Naming it directly restores exactly the stacking the founder approved; the double
       class is what outranks the `:nth-child(2)` rule above. */
    .apoyu-col__tab.apoyu-col__tab--mystery { z-index: 7; }
    .apoyu-col__tab.is-selected { z-index: 9; transform: translateY(-14px); }
    .apoyu-col__tab:hover { z-index: 8; }
    .apoyu-col__count { align-self: start; margin-top: 4px; }
  }

  /* ── TRUST: FIRST LIGHT ─────────────────────────────────────────────────────
     No object, no icons, no shield badge: a short typographic stanza standing in
     the light. The only ornament is a warm point before each claim and a hairline
     rule down the side — the first points of light, not a feature list. */
  .apoyu-trust { display: grid; justify-items: center; text-align: center; row-gap: 26px;
    padding-top: clamp(24px, 6vh, 80px); padding-bottom: clamp(48px, 9vh, 110px); }
  .apoyu-trust__copy { display: grid; gap: 12px; justify-items: center; }
  .apoyu-trust__support { margin: 0; color: var(--ink-dim); font-size: clamp(15px, 1vw + 10px, 17px);
    line-height: 1.5; max-width: 40ch; text-wrap: balance; }
  /* The claims read as a block of left-aligned lines even on a centred phone column: a stanza
     ragged down one edge is a stanza, and three centred lines are a poster. */
  .apoyu-trust__body { display: grid; gap: 18px; width: 100%; max-width: 34rem; text-align: left; }
  .apoyu-trust__stanza { list-style: none; margin: 0; display: grid; gap: 14px; max-width: 30ch;
    padding: 2px 0 2px 24px; border-left: 1px solid rgba(255, 196, 140, .18); }
  /* Balanced, so a claim that wraps never strands its last word ("AI.") on a line of its own. */
  .apoyu-trust__claim { position: relative; margin: 0; line-height: 1.25; font-weight: 600;
    font-size: clamp(20px, 2.2vw, 24px); text-wrap: balance; }
  .apoyu-trust__claim::before { content: ''; position: absolute; left: -16px; top: .62em;
    width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%;
    background: radial-gradient(circle, #FFD9A8 0%, #FFB25C 100%);
    box-shadow: 0 0 10px rgba(255, 178, 92, .45); }
  /* The one true sentence that a lock icon would have hidden: per-day results DO sync. It is
     above the disclosure, not inside it, because a trust beat with something to bury is not one. */
  .apoyu-trust__nuance { margin: 0; color: var(--ink-dim); font-size: 15px; line-height: 1.5;
    max-width: 46ch; }
  .apoyu-trust__links { display: flex; flex-wrap: wrap; gap: 0 18px; margin: 0; }
  .apoyu-trust__links a { display: inline-flex; align-items: center; min-height: 44px;
    padding: 10px 0; color: var(--ink-dim); font-size: 14px; text-decoration: underline;
    text-underline-offset: 3px; }
  .apoyu-trust__links a:hover { color: var(--ink); }
  .apoyu-trust__links a:focus-visible { color: var(--ink); outline: 2px solid #FFD9A8;
    outline-offset: 3px; }

  /* ── DISCLOSURE (Trust once, the FAQ five times) ─────────────────────────────
     A real button in a real heading, and a panel whose height is a grid ROW, so
     nothing is ever measured in JavaScript. `visibility` is delayed by the same
     duration, so a closed panel is genuinely out of the tab order. */
  .apoyu-acc { border-top: 1px solid rgba(244, 239, 230, .10); }
  .apoyu-acc__heading { margin: 0; font: inherit; }
  .apoyu-acc__button { display: flex; align-items: center; justify-content: space-between;
    gap: 16px; width: 100%; min-height: 48px; padding: 14px 0; background: none; border: 0;
    color: var(--ink); font-size: 17px; font-weight: 600; line-height: 1.35; text-align: left;
    cursor: pointer; }
  .apoyu-acc__button:focus-visible { outline: 2px solid #FFD9A8; outline-offset: 3px; }
  /* Two borders of a square, rotated. No icon font, no SVG, no third asset to keep in sync. */
  .apoyu-acc__chevron { flex: none; width: 9px; height: 9px; margin-right: 4px;
    border-right: 1.5px solid var(--ink-dim); border-bottom: 1.5px solid var(--ink-dim);
    transform: translateY(-2px) rotate(45deg); transition: transform 240ms ease; }
  .apoyu-acc__button[aria-expanded="true"] .apoyu-acc__chevron {
    transform: translateY(2px) rotate(225deg); }
  .apoyu-acc__panel { display: grid; grid-template-rows: 0fr; visibility: hidden;
    transition: grid-template-rows 240ms ease, visibility 0s linear 240ms; }
  .apoyu-acc__panel[data-open="1"] { grid-template-rows: 1fr; visibility: visible;
    transition: grid-template-rows 240ms ease, visibility 0s; }
  .apoyu-acc__inner { min-height: 0; overflow: hidden; }
  .apoyu-acc__inner > :last-child { margin-bottom: 16px; }
  .apoyu-acc__answer { margin: 0 0 10px; color: var(--ink-dim); font-size: 15px; line-height: 1.55;
    max-width: 60ch; }
  @media (prefers-reduced-motion: reduce) {
    .apoyu-acc__panel, .apoyu-acc__panel[data-open="1"], .apoyu-acc__chevron { transition: none; }
  }

  /* ── FAQ ────────────────────────────────────────────────────────────────────
     The eyebrow IS the heading here. A display headline over five accordion rows
     would out-shout the ask that follows, and the ask is what this page is for. */
  .apoyu-faq { display: grid; gap: 18px; align-content: start;
    padding-top: clamp(48px, 8vh, 96px); padding-bottom: clamp(40px, 7vh, 96px); }
  .apoyu-faq__list { display: grid; }

  /* ── THE CLOSE: SUNRISE ─────────────────────────────────────────────────────
     The page ends on the word it opened with, in the only warm ground it has had
     since dusk. Plain DOM: no Rive, no Skia, no clock. If the 4 MB card runtime
     never arrives, the ask still works. */
  .apoyu-claim { min-height: 78svh; display: grid; align-content: center; justify-items: center;
    padding-top: clamp(56px, 10vh, 120px); padding-bottom: clamp(40px, 8vh, 96px); }
  .apoyu-claim__stack { display: grid; gap: 16px; justify-items: center; text-align: center;
    width: 100%; max-width: 560px; }
  .apoyu-claim__form { display: grid; gap: 10px; width: 100%; margin-top: 6px; }
  /* The dim ink was tuned for the night; on the sunrise floor (about #6A4650 at 1.0) it measures
     3.3:1, so the free line and the legal links carry the page ink at reduced opacity instead —
     the same hierarchy, legible in the light it actually sits in. */
  .apoyu-claim .apoyu-fine, .apoyu-claim .apoyu-support { color: rgba(244, 239, 230, .82); }
  /* 16 px is a floor, not a preference: iOS zooms the page on focus below it, and a landing that
     zooms itself the instant a visitor taps the one field has lost them. */
  .apoyu-claim__email { width: 100%; min-height: 52px; border-radius: 999px; padding: 0 20px;
    background: rgba(244, 239, 230, .08); border: 1px solid rgba(244, 239, 230, .18);
    color: var(--ink); font: inherit; font-size: 16px; }
  .apoyu-claim__email::placeholder { color: var(--ink-dim); }
  .apoyu-claim__email:focus-visible { outline: 2px solid #FFD9A8; outline-offset: 2px; }
  .apoyu-claim__form .apoyu-cta { min-height: 52px; }
  .apoyu-claim__error { margin: 0; color: var(--ember); font-size: 14px; grid-column: 1 / -1;
    text-align: center; }
  @media (min-width: 600px) {
    .apoyu-claim__form { grid-template-columns: minmax(0, 1fr) auto; }
  }

  /* ── FOOTER ─────────────────────────────────────────────────────────────────
     Four legal links and the one line the store requires, inside the same light.
     `z-index` because this sits beside `main`, not inside its stacking context. */
  .apoyu-foot { position: relative; z-index: 1; text-align: center;
    padding-top: 8px; padding-bottom: 40px; }
  .apoyu-foot__nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 8px; }
  .apoyu-foot__link { display: inline-flex; align-items: center; min-height: 44px; padding: 0 10px;
    color: rgba(244, 239, 230, .78); font-size: 13px; text-decoration: none; }
  .apoyu-foot__link:hover { color: var(--ink); text-decoration: underline; }
  .apoyu-foot__link:focus-visible { color: var(--ink); text-decoration: underline;
    outline: 2px solid #FFD9A8; outline-offset: 2px; }
  .apoyu-foot__note { margin: 6px 0 0; color: rgba(244, 239, 230, .7); font-size: 12px; }

  @media (min-width: 900px) {
    /* Trust: the copy holds the left, the claims stand in the light on the right. The right
       column drops by a hair so the first claim's cap height meets the headline's. */
    .apoyu-trust { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      column-gap: clamp(40px, 5vw, 84px); align-items: start; text-align: left;
      justify-items: start; }
    .apoyu-trust__copy { justify-items: start; }
    .apoyu-trust__support { max-width: 34ch; }
    .apoyu-trust__body { padding-top: 6px; max-width: none; }
    /* The FAQ's eyebrow becomes a column label, and the questions get a measured column rather
       than the full 1240: an accordion row a metre wide is a row nobody can scan. */
    .apoyu-faq { grid-template-columns: 220px minmax(0, 640px);
      column-gap: clamp(40px, 5vw, 84px); justify-content: center; align-items: start; }
    .apoyu-claim { min-height: 56svh; }
  }

  /* ── PREVIEW SHEET ──────────────────────────────────────────────────────── */
  .apoyu-sheet { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
    padding: 24px; background: rgba(8,4,14,.62); backdrop-filter: blur(6px); }
  /* The sheet is cut from the same stock as the card back — milled, framed, lit from below by the
     room's fire — so the last thing a visitor sees after the CTA is still this world. */
  .apoyu-sheet__card { position: relative; max-width: 380px; width: 100%; display: grid; gap: 10px;
    padding: 26px 26px 24px; border-radius: 18px; overflow: hidden;
    background:
      radial-gradient(110% 70% at 50% 112%, rgba(255,140,55,.16) 0%, rgba(255,140,55,0) 60%),
      repeating-linear-gradient(118deg, rgba(255,232,205,.035) 0 1px, rgba(0,0,0,0) 1px 6px),
      linear-gradient(160deg, #2A1A3E 0%, #1B1128 55%, #140D1F 100%);
    box-shadow: 0 30px 80px -24px rgba(0,0,0,.9), 0 0 0 1px rgba(255,220,180,.12) inset; }
  .apoyu-sheet__card::before { content: ''; position: absolute; inset: 7px; border-radius: 12px;
    border: 1px solid rgba(255,222,186,.10); pointer-events: none; }
  .apoyu-sheet__title { margin: 0; font-size: 18px; font-weight: 600; color: var(--ember);
    font-family: 'Fredoka-SemiBold', ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif;
    letter-spacing: .01em; }
  .apoyu-sheet__body { margin: 0 0 8px; color: var(--ink-dim); font-size: 14px; line-height: 1.5; }
  .apoyu-cta--quiet { justify-self: start; background: rgba(255,255,255,.09); color: var(--ink);
    box-shadow: none; padding: 11px 20px; font-size: 15px; }

  .apoyu-sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  /* The first paint, then the veil. In flow until React commits; then positioned over the React
     hero (same classes → same geometry), pointer-transparent so the real CTA beneath is live, and
     faded out once the exact card has its poster. Never removed on a canvas, never on a timer. */
  #boot-fallback { position: relative; z-index: 1; }
  #boot-fallback.is-veil { position: absolute; top: 0; left: 0; right: 0; z-index: 4;
    pointer-events: none; }
  /* While veiled, only the POSTER stays visible. The React hero beneath already renders the same
     copy and the live CTA; a second copy of the text at a sub-pixel offset ghosts it (seen in the
     throttled recording), and the dormant CTA has nothing left to be honest about. */
  #boot-fallback.is-veil .apoyu-hero__copy, #boot-fallback.is-veil .apoyu-act,
  #boot-fallback.is-veil .apoyu-cardstage__light, #boot-fallback.is-veil .apoyu-cardstage__shadow,
  #boot-fallback.is-veil #boot-note { visibility: hidden; }
  #boot-fallback.is-leaving { opacity: 0; transition: opacity 440ms ease; }
  @media (prefers-reduced-motion: reduce) { #boot-fallback.is-leaving { transition: none; } }
  #boot-note { color: var(--ink-dim); font-size: 12px; margin: 0; padding-bottom: 16px; }
</style>
